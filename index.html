<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pookinator Menu</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #faf6f1;
        --ink: #2c241b;
        --muted: #6f6458;
        --card: #fffdf9;
        --line: #e6dcd0;
        --accent: #8b3a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.4;
      }

      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.25rem 0.85rem 2.5rem;
      }

      header {
        text-align: center;
        margin-bottom: 1.1rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: clamp(1.15rem, 4.5vw, 1.45rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-style: italic;
        font-size: 0.95rem;
      }

      .status {
        text-align: center;
        color: var(--muted);
      }

      .menu {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        min-width: 0;
      }

      article img {
        display: block;
        width: 100%;
        height: 5rem;
        object-fit: cover;
        background: #efe6db;
      }

      .body {
        padding: 0.55rem 0.65rem 0.7rem;
      }

      h2 {
        margin: 0 0 0.1rem;
        font-size: 0.98rem;
        font-weight: 400;
      }

      .meta {
        margin: 0 0 0.35rem;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .description {
        margin: 0 0 0.45rem;
        font-size: 0.8rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin: 0 0 0.45rem;
        padding: 0;
        list-style: none;
      }

      .tags li {
        font-family: system-ui, sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.08rem 0.4rem;
        color: var(--muted);
      }

      .customizations {
        margin: 0;
        padding-top: 0.45rem;
        border-top: 1px solid var(--line);
      }

      .customizations h3 {
        margin: 0 0 0.3rem;
        font-size: 0.68rem;
        font-family: system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      .choice {
        margin: 0 0 0.3rem;
        font-size: 0.75rem;
      }

      .choice:last-child {
        margin-bottom: 0;
      }

      .choice strong {
        font-weight: 600;
      }

      @media (min-width: 540px) {
        .menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        main {
          padding: 1.75rem 1.25rem 3rem;
        }

        article img {
          height: 5.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Pookinator Menu</h1>
        <p class="subtitle">What would you like to eat this week?</p>
      </header>
      <p id="status" class="status">Loading menu…</p>
      <section id="menu" class="menu" hidden></section>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const menuEl = document.getElementById("menu");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function templatesFrom(menu) {
        return menu.templates || menu["templates:"] || [];
      }

      function itemsFrom(menu) {
        if (Array.isArray(menu)) {
          return menu;
        }
        return menu.items || [];
      }

      function resolveItem(item, templatesByName) {
        const template = item.template
          ? templatesByName.get(item.template)
          : null;
        if (!template) {
          return item;
        }
        return { ...template, ...item };
      }

      function renderCustomizations(customizations) {
        if (!Array.isArray(customizations) || customizations.length === 0) {
          return "";
        }

        const choices = customizations
          .map((choice) => {
            const label = escapeHtml(choice.name);
            const type = choice.type === "multi" ? "choose any" : "choose one";
            const options = (choice.options || []).map(escapeHtml).join(", ");
            return `<p class="choice"><strong>${label}</strong> (${type}): ${options}</p>`;
          })
          .join("");

        return `<div class="customizations"><h3>Customizations</h3>${choices}</div>`;
      }

      function renderItem(item) {
        const tags = (item.tags || [])
          .map((tag) => `<li>${escapeHtml(tag)}</li>`)
          .join("");
        const image = item.image
          ? `<img src="${escapeHtml(item.image)}" alt="" />`
          : "";

        return `
          <article>
            ${image}
            <div class="body">
              <h2>${escapeHtml(item.name)}</h2>
              <p class="meta">${[item.category, item.prepTime]
                .filter(Boolean)
                .map(escapeHtml)
                .join(" · ")}</p>
              <p class="description">${escapeHtml(item.description)}</p>
              ${tags ? `<ul class="tags">${tags}</ul>` : ""}
              ${renderCustomizations(item.customizations)}
            </div>
          </article>
        `;
      }

      fetch("./menu.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Could not load menu.json");
          }
          return response.json();
        })
        .then((menu) => {
          const templatesByName = new Map(
            templatesFrom(menu).map((template) => [template.template, template])
          );
          const active = itemsFrom(menu)
            .map((item) => resolveItem(item, templatesByName))
            .filter((item) => item.active);
          if (active.length === 0) {
            statusEl.textContent = "No dishes on the menu tonight.";
            return;
          }
          menuEl.innerHTML = active.map(renderItem).join("");
          menuEl.hidden = false;
          statusEl.hidden = true;
        })
        .catch(() => {
          statusEl.textContent =
            "Couldn’t load the menu. If you’re opening this file directly, serve it over HTTP (GitHub Pages will work).";
        });
    </script>
  </body>
</html>
