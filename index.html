<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dinner Menu</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #faf6f1;
        --ink: #2c241b;
        --muted: #6f6458;
        --card: #fffdf9;
        --line: #e6dcd0;
        --accent: #8b3a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 1.6rem;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-style: italic;
      }

      .status {
        text-align: center;
        color: var(--muted);
      }

      .menu {
        display: grid;
        gap: 1.25rem;
      }

      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      article img {
        display: block;
        width: 100%;
        height: 10rem;
        object-fit: cover;
        background: #efe6db;
      }

      .body {
        padding: 1rem 1.1rem 1.15rem;
      }

      h2 {
        margin: 0 0 0.2rem;
        font-size: 1.35rem;
        font-weight: 400;
      }

      .meta {
        margin: 0 0 0.7rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .description {
        margin: 0 0 0.85rem;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 0.85rem;
        padding: 0;
        list-style: none;
      }

      .tags li {
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
        color: var(--muted);
      }

      .customizations {
        margin: 0;
        padding-top: 0.75rem;
        border-top: 1px solid var(--line);
      }

      .customizations h3 {
        margin: 0 0 0.45rem;
        font-size: 0.85rem;
        font-family: system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      .choice {
        margin: 0 0 0.55rem;
        font-size: 0.95rem;
      }

      .choice:last-child {
        margin-bottom: 0;
      }

      .choice strong {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tonight’s Menu</h1>
        <p class="subtitle">Pick what you’d like for dinner</p>
      </header>
      <p id="status" class="status">Loading menu…</p>
      <section id="menu" class="menu" hidden></section>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const menuEl = document.getElementById("menu");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderCustomizations(customizations) {
        if (!Array.isArray(customizations) || customizations.length === 0) {
          return "";
        }

        const choices = customizations
          .map((choice) => {
            const label = escapeHtml(choice.name);
            const type = choice.type === "multi" ? "choose any" : "choose one";
            const options = (choice.options || []).map(escapeHtml).join(", ");
            return `<p class="choice"><strong>${label}</strong> (${type}): ${options}</p>`;
          })
          .join("");

        return `<div class="customizations"><h3>Customizations</h3>${choices}</div>`;
      }

      function renderItem(item) {
        const tags = (item.tags || [])
          .map((tag) => `<li>${escapeHtml(tag)}</li>`)
          .join("");
        const image = item.image
          ? `<img src="${escapeHtml(item.image)}" alt="" />`
          : "";

        return `
          <article>
            ${image}
            <div class="body">
              <h2>${escapeHtml(item.name)}</h2>
              <p class="meta">${escapeHtml(item.category)} · ${escapeHtml(item.prepTime)}</p>
              <p class="description">${escapeHtml(item.description)}</p>
              ${tags ? `<ul class="tags">${tags}</ul>` : ""}
              ${renderCustomizations(item.customizations)}
            </div>
          </article>
        `;
      }

      fetch("./menu.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Could not load menu.json");
          }
          return response.json();
        })
        .then((items) => {
          const active = items.filter((item) => item.active);
          if (active.length === 0) {
            statusEl.textContent = "No dishes on the menu tonight.";
            return;
          }
          menuEl.innerHTML = active.map(renderItem).join("");
          menuEl.hidden = false;
          statusEl.hidden = true;
        })
        .catch(() => {
          statusEl.textContent =
            "Couldn’t load the menu. If you’re opening this file directly, serve it over HTTP (GitHub Pages will work).";
        });
    </script>
  </body>
</html>
